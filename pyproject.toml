[project]
name = "nigeria-food-price-pipeline"
version = "0.1.0"
description = "End-to-end data pipeline for food price monitoring and forecasting in Nigerian markets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["data-engineering", "machine-learning", "nigeria", "food-prices", "forecasting"]

dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.9.0",
    "optuna>=3.4.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",
]
orchestration = [
    "apache-airflow>=2.8.0",
]
quality = [
    "great-expectations>=0.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0,<1.14.0",
    "types-requests>=2.31.0",
    "pre-commit>=3.6.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "ml*"]
exclude = ["tests*", "dbt*", "docker*", "airflow*", "dashboard*", "great_expectations*", "docs*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM"]
ignore = ["E501", "N806", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ingestion --cov=ml --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
